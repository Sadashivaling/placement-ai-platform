<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement AI Platform</title>

<style>
/* Hide Owner from the PUBLIC role-selection page */
#rolePage .role-card:nth-child(3) {
    display: none !important;
}

/* Keep Owner login/dashboard available when explicitly opened */
</style>
</head>

<body>

<script>
/*
    IMPORTANT:
    Your existing complete application code should remain below this point.

    This protection hides only the public Owner card.
    It does NOT remove the Owner Login or Owner Dashboard.
*/

/*
    If the existing page contains an Owner role card,
    hide it after the existing HTML loads.
*/
window.addEventListener("DOMContentLoaded", function () {

    const rolePage = document.getElementById("rolePage");

    if (rolePage) {
        const cards = rolePage.querySelectorAll(".role-card");

        if (cards.length >= 3) {
            cards[2].style.display = "none";
        }
    }

});
</script>

</body>
</html>
